spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/subscription_app
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd
    time-zone: Asia/Tokyo
server:
  port: 8080